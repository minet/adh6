stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_REGISTRY_BASE: $CI_REGISTRY_IMAGE
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: 1

.docker_login: &docker_login
  image: docker:latest
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - |
      if [ "$CI_COMMIT_BRANCH" = "master" ]; then
        TAG="stable"
      elif [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        TAG="prep"
      else
        TAG="$CI_COMMIT_SHORT_SHA"
      fi

# Promotion guard: master only receives code that went through dev first.
# An MR into master must come from dev.
guard_master_mr_source:
  stage: .pre
  image: alpine:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "dev"'
  script:
    - echo "MRs into master must come from dev (source is $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME)."
    - echo "Retarget this MR to dev, test on preprod, then open dev -> master."
    - exit 1

# Every non-merge commit on master must already be on dev. Runs in .pre so
# nothing gets built as :stable, and deploy_prod needs it, so prod is never
# deployed when the check fails.
guard_master_from_dev:
  stage: .pre
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
  script:
    - apk add --no-cache git
    - git fetch origin dev
    - |
      MISSING=$(git log --no-merges --oneline FETCH_HEAD..$CI_COMMIT_SHA)
      if [ -n "$MISSING" ]; then
        echo "These commits are on master but not on dev:"
        echo "$MISSING"
        echo "Merge them into dev and validate on preprod before promoting."
        exit 1
      fi
      echo "OK: every commit on master is on dev."

build_backend:
  <<: *docker_login
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master")'
      changes:
        - backend/**/*
        - docker-bake.hcl
        - openapi/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "dev" && $CI_COMMIT_BRANCH != "master"'
      changes:
        - backend/**/*
        - docker-bake.hcl
        - openapi/**/*
        - .gitlab-ci.yml
  script:
    - REGISTRY=$IMAGE_REGISTRY_BASE TAG=$TAG docker buildx bake -f docker-bake.hcl backend
    # Both pushes at once; each pid is waited for so that a failed push fails the job
    - |
      docker push "$IMAGE_REGISTRY_BASE/backend:$TAG" & PROD_PUSH=$!
      docker push "$IMAGE_REGISTRY_BASE/backend-test:$TAG" & TEST_PUSH=$!
      wait "$PROD_PUSH" && wait "$TEST_PUSH"

build_frontend:
  <<: *docker_login
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master")'
      changes:
        - frontend/**/*
        - openapi/**/*
        - .gitlab-ci.yml
  script:
    - docker build
        --cache-from $IMAGE_REGISTRY_BASE/frontend:$TAG
        --build-arg BUILDKIT_INLINE_CACHE=1
        --provenance=false
        --target prod
        --file frontend/Dockerfile
        --tag $IMAGE_REGISTRY_BASE/frontend:$TAG
        .
    - docker push $IMAGE_REGISTRY_BASE/frontend:$TAG

build_reverse_proxy:
  <<: *docker_login
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "master")'
      changes:
        - reverse_proxy/**/*
        - .gitlab-ci.yml
  script:
    - docker build
        --cache-from $IMAGE_REGISTRY_BASE/reverse_proxy:$TAG
        --build-arg BUILDKIT_INLINE_CACHE=1
        --provenance=false
        --file reverse_proxy/Dockerfile
        --target prod
        --tag $IMAGE_REGISTRY_BASE/reverse_proxy:$TAG
        .
    - docker push $IMAGE_REGISTRY_BASE/reverse_proxy:$TAG

test_backend:
  stage: test
  before_script: []
  variables:
    GIT_STRATEGY: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      variables:
        TAG: stable
      changes:
        - backend/**/*
        - docker-bake.hcl
        - openapi/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      variables:
        TAG: prep
      changes:
        - backend/**/*
        - docker-bake.hcl
        - openapi/**/*
        - .gitlab-ci.yml
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "dev" && $CI_COMMIT_BRANCH != "master"'
      variables:
        TAG: $CI_COMMIT_SHORT_SHA
      changes:
        - backend/**/*
        - docker-bake.hcl
        - openapi/**/*
        - .gitlab-ci.yml
  image:
    name: $IMAGE_REGISTRY_BASE/backend-test:$TAG
  needs:
    - job: build_backend
      optional: true
  script:
    - cd /app
    - ruff format --diff
    - ruff check --output-format=gitlab --output-file=code-quality-report.json
    - pyright
    - pytest -n auto --junitxml=/app/report.xml --cov-report=xml:/app/coverage.xml
  after_script:
    - cp /app/report.xml $CI_PROJECT_DIR/report.xml
    - cp /app/coverage.xml $CI_PROJECT_DIR/coverage.xml
    - cp /app/code-quality-report.json $CI_PROJECT_DIR/code-quality-report.json
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      codequality: code-quality-report.json
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

deploy_prod:
  stage: deploy
  trigger:
    project: minet/configurations/push/swarm-prod
    branch: main
    strategy: depend
    inputs:
      folder_name: adh6.minet.net
      image_registry: $CI_REGISTRY_IMAGE
  needs:
    - job: guard_master_from_dev
    - job: build_backend
      optional: true
    - job: build_frontend
      optional: true
    - job: build_reverse_proxy
      optional: true
    - job: test_backend
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
      changes:
        - backend/**/*
        - docker-bake.hcl
        - frontend/**/*
        - reverse_proxy/**/*
        - openapi/**/*
        - .gitlab-ci.yml

deploy_dev:
  stage: deploy
  trigger:
    project: minet/configurations/push/swarm-prod
    branch: preprod
    strategy: depend
    inputs:
      folder_name: adh6.minet.net
      image_registry: $CI_REGISTRY_IMAGE
  needs:
    - job: build_backend
      optional: true
    - job: build_frontend
      optional: true
    - job: build_reverse_proxy
      optional: true
    - job: test_backend
      optional: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "dev"'
      changes:
        - backend/**/*
        - docker-bake.hcl
        - frontend/**/*
        - reverse_proxy/**/*
        - openapi/**/*
        - .gitlab-ci.yml
