@if (result$ | async; as result) {
  <div>
    @if (loading) {
      <p role="status" i18n="@@common.loading.title">Chargement ...</p>
    } @else if (searchFailed) {
      <div role="alert">
        <p i18n="@@search.error">Impossible de charger les résultats.</p>
        <button
          class="button is-small"
          type="button"
          (click)="retrySearch()"
          i18n="@@search.retry">
          Réessayer
        </button>
      </div>
    } @else if (result.length === 0) {
      <p
        class="title"
        i18n="Tells the user they have no registered devices@@device.list.none">
        Aucun appareil enregistré
      </p>
    } @else {
      <!-- Container with rounded corners for the entire device list -->
      <div class="device-list-container">
        @for (device of result; track device.id; let i = $index) {
          <div
            class="device-item"
            [class.is-first]="i === 0"
            [class.is-last]="i === result.length - 1">
            <app-element
              [device]="device"
              style="padding: 0% 0%"
              (removed)="updateSearch()"></app-element>
          </div>
        }
      </div>
    }
  </div>
} @else {
  <div class="notification is-info is-light has-text-centered">
    <h4 class="title is-4"><span i18n="@@loading">Chargement</span> ...</h4>
  </div>
}
