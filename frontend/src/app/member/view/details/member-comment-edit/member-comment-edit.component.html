<div class="modal is-active">
  <div class="modal-background"></div>
  <div class="modal-content">
    @if (memberId$ | async; as memberId) {
      <div class="box">
        <form
          [formGroup]="memberComment"
          (ngSubmit)="update(memberId)"
          novalidate>
          <div class="field">
            <label class="label" i18n="@@member.comment.new"
              >Nouveau commentaire</label
            >
            <p class="control has-icons-right">
              <textarea
                class="textarea"
                formControlName="comment"
                maxlength="255"
                placeholder="Commentaire max 255 caractères"
                i18n-placeholder="@@member.comment.placeholder"></textarea>
            </p>
          </div>
          <button
            type="submit"
            class="button is-primary is-fullwidth"
            [disabled]="memberComment.invalid"
            i18n="@@validate">
            Valider
          </button>
        </form>
      </div>
    }
  </div>
</div>
