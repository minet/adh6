<h3 class="title is-4">
  <span i18n="@@mailinglist">Listes de diffusion</span>
</h3>
<hr />
<div class="field">
  <input
    id="mailMiNET"
    type="checkbox"
    name="mailMiNET"
    class="is-info"
    [(ngModel)]="mailMiNET"
    (change)="updateMailinglist()"
    checked="checked" />
  <label for="mailMiNET" i18n="Describe MiNET mailing list@@mailinglist.minet">
    <strong>MiNET : </strong>
    Problèmes techniques et informations sur l'association
  </label>
</div>
<div class="field">
  <input
    id="mailHosting"
    type="checkbox"
    name="mailHosting"
    class="is-info"
    [(ngModel)]="mailHosting"
    (change)="updateMailinglist()"
    checked="checked" />
  <label
    for="mailHosting"
    i18n="Describe hosting mailing list@@mailinglist.hosting">
    <strong>Hosting :</strong>
    Pour les utilisateurs de hosting, concernant les problèmes techniques et
    informations complémentaires sur l'hébergement
  </label>
</div>
<div class="field">
  <input
    id="mailRouteur"
    type="checkbox"
    name="mailRouteur"
    class="is-info"
    [(ngModel)]="mailRouteur"
    (change)="updateMailinglist()"
    checked="checked" />
  <label
    for="mailRouteur"
    i18n="Describe 'mini-routeur' mailing list@@mailinglist.router">
    <strong>Mini-routeurs :</strong>
    Pour les utilisateurs des minirouteurs, informations et mise à jour
    technique des mini-routeurs
  </label>
</div>
