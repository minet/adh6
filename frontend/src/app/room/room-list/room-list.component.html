<div class="columns">
  <div class="column">
    <input
      id="search-box"
      class="input is-fullwidth"
      type="text"
      [formControl]="roomSearch"
      aria-label="Recherche de chambres"
      i18n-aria-label="@@room.list.search"
      placeholder="Rechercher..."
      i18n-placeholder="@@common.search.placeholder" />
  </div>
  <br />
  <div class="column is-narrow">
    <a [routerLink]="['/room/add']">
      <button class="button is-primary" i18n="@@room.list.new">
        Nouvelle chambre
      </button>
    </a>
  </div>
</div>
<table class="table is-hoverable is-striped is-fullwidth is-clickable">
  <thead>
    <tr>
      <th style="width: 33%" i18n="@@room.list.number">Numéro</th>
      <th style="width: 33%">Description</th>
      <th style="width: 33%">VLAN</th>
    </tr>
  </thead>
  @if (result$ | async; as result) {
    <tbody>
      @for (room of result; track room) {
        <tr [routerLink]="['/room/view', room.id]">
          <td>{{ room.roomNumber }}</td>
          <td>{{ room.description }}</td>
          <td>{{ room.vlan }}</td>
        </tr>
      }
    </tbody>
  } @else {
    <tr>
      <td colspan="42">
        <div class="notification is-info is-light has-text-centered">
          <h4 class="title is-4" i18n="@@common.loading.title">
            Chargement ...
          </h4>
        </div>
      </td>
    </tr>
  }
</table>
<app-pagination
  [page]="currentPage"
  [itemsPerPage]="itemsPerPage"
  [maxItems]="maxItems"
  (pageChange)="handlePageChange($event)"></app-pagination>
